services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    network_mode: host
    user: "${TUNNEL_UID:-1000}:${TUNNEL_GID:-1000}"
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token-file
      - /run/secrets/tunnel-token
    volumes:
      - type: bind
        source: ./.cloudflare/tunnel.token
        target: /run/secrets/tunnel-token
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
